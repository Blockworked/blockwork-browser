<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calculus practice</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #eef1f5; }
  header { background: #2d3a4b; color: #fff; padding: 14px 32px; font-weight: 600; }
  main { max-width: 760px; margin: 40px auto; background: #fff; border-radius: 10px; padding: 28px 36px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .meta { color: #6b7684; font-size: 14px; margin-bottom: 20px; }
  .answer { display: inline-flex; align-items: center; gap: 4px; margin: 0 4px; }
  input { width: 150px; height: 34px; border: 1px solid #b7c0cc; border-radius: 6px; padding: 0 10px; font: inherit; }
  input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
  .palette { height: 34px; border: 1px solid #b7c0cc; background: #f6f8fa; border-radius: 6px; padding: 0 8px; font: inherit; }
  p { margin: 14px 0; }
  .actions { margin-top: 28px; display: flex; gap: 10px; }
  .actions button { height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid #b7c0cc; background: #fff; font: inherit; }
  .actions .submit { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
  <header>Calculus practice</header>
  <main>
    <h2>Question 3</h2>
    <div class="meta">f(x) = x³ − 3x. Give your answers in interval notation.</div>
    <p>The function is concave up on
      <span class="answer"><input aria-label="first answer" value="(0, ∞)"><button class="palette" title="Symbols">∫π∑∂</button></span>
    </p>
    <p>and concave down on
      <span class="answer"><input aria-label="second answer"><button class="palette" title="Symbols">∫π∑∂</button></span>.
    </p>
    <div class="actions"><button class="submit">Submit answer</button><button>Skip</button></div>
  </main>
</body>
</html>

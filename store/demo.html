<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Your cart</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #eef1f5; }
  header { background: #2d3a4b; color: #fff; padding: 14px 32px; font-weight: 600; }
  main { width: 680px; margin: 40px 0 40px 120px; background: #fff; border-radius: 10px; padding: 28px 36px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .meta { color: #6b7684; font-size: 14px; margin-bottom: 12px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e3e7ec; }
  .thumb { width: 44px; height: 44px; border-radius: 6px; background: #dbe3ec; }
  .name { flex: 1; }
  .price { width: 70px; text-align: right; color: #4b5563; }
  input { width: 56px; height: 34px; border: 1px solid #b7c0cc; border-radius: 6px; padding: 0 10px; font: inherit; }
  input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
  .update { height: 34px; border: 1px solid #b7c0cc; background: #f6f8fa; border-radius: 6px; padding: 0 12px; font: inherit; }
  .actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #e3e7ec; padding-top: 20px; }
  .total { flex: 1; font-weight: 600; }
  .actions button { height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid #b7c0cc; background: #fff; font: inherit; }
  .actions .checkout { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
  <header>Example Shop</header>
  <main>
    <h2>Your cart</h2>
    <div class="meta">3 items</div>
    <div class="item"><div class="thumb"></div><div class="name">Notebook, A5</div>
      <input aria-label="Notebook quantity" value="2"><button class="update">Update</button><div class="price">$9.00</div></div>
    <div class="item"><div class="thumb"></div><div class="name">Desk lamp</div>
      <input aria-label="Lamp quantity" value="1"><button class="update">Update</button><div class="price">$24.00</div></div>
    <div class="item"><div class="thumb"></div><div class="name">Pencils, pack of 12</div>
      <input aria-label="Pencils quantity" value="1"><button class="update">Update</button><div class="price">$4.50</div></div>
    <div class="actions"><div class="total">Total $46.50</div><button>Keep shopping</button><button class="checkout">Check out</button></div>
  </main>
</body>
</html>

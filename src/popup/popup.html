<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="18" height="18">
    <h1>Blockwork</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="state">Starting</span></span>
  </header>

  <main>
    <p id="detail" class="detail" hidden></p>

    <section class="row">
      <div class="text">
        <h2>Pick an element</h2>
        <p>Click something on the page to copy a selector for the browser blocks. Right-click an element and choose <b>Copy Blockwork selector</b> works too.</p>
      </div>
      <button id="pick" class="primary">Pick</button>
    </section>

    <details id="pairing" class="row">
      <summary>
        <div class="text">
          <h2>Pairing</h2>
          <p>Paste the key from Settings &gt; Integrations in Blockwork.</p>
        </div>
      </summary>
      <label>Pairing key
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the pairing key">
      </label>
      <label>Port
        <input id="port" type="number" min="1" max="65535" value="8788">
      </label>
      <button id="save" class="primary">Connect</button>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
